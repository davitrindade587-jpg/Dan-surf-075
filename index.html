<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#073b4c">
<title>Dan Surf Original | Gestão</title>
<style>
:root{--navy:#073b4c;--deep:#052b38;--teal:#087e8b;--mint:#c9f2e7;--sand:#f5e9d4;--ink:#17323a;--muted:#6b7f84;--paper:#f4f8f7;--white:#fff;--line:#e0eae7;--red:#c84c4c;--green:#16836b;--shadow:0 8px 26px #123b4510}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.45 Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{min-height:100vh;display:grid;grid-template-columns:248px 1fr}.sidebar{background:var(--deep);color:#eaf8f4;padding:22px 14px;display:flex;flex-direction:column;gap:24px}.brand{display:flex;align-items:center;gap:11px;padding:4px 8px}.logo{width:44px;height:44px;border-radius:15px;background:var(--mint);color:var(--deep);display:grid;place-items:center;font-size:23px;font-weight:900}.brand strong{display:block;font-size:15px;letter-spacing:.3px}.brand small{color:#a6c8c7;font-size:11px;letter-spacing:1.5px}.nav{display:grid;gap:5px}.nav button{border:0;background:transparent;color:#b8d3d2;text-align:left;padding:12px 13px;border-radius:12px;display:flex;align-items:center;gap:12px}.nav button.active,.nav button:hover{background:#104858;color:white}.nav .ico{width:22px;text-align:center;font-size:18px}.side-note{margin-top:auto;background:#0c3c49;border:1px solid #1b5964;padding:14px;border-radius:14px;color:#c3dfdc;font-size:12px}.side-note b{display:block;color:white;margin-bottom:4px}.main{min-width:0}.topbar{height:78px;background:#ffffffd9;backdrop-filter:blur(12px);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 30px;position:sticky;top:0;z-index:5}.top-title{font-size:14px;color:var(--muted)}.top-title strong{display:block;color:var(--ink);font-size:18px}.user{display:flex;align-items:center;gap:10px}.avatar{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--sand);color:var(--navy);font-weight:800}.content{padding:28px 30px;max-width:1450px;margin:auto}.welcome{display:flex;align-items:flex-start;justify-content:space-between;gap:15px;margin-bottom:24px}.welcome h1{font-size:27px;line-height:1.2;margin:0 0 7px;letter-spacing:-.7px}.welcome p{margin:0;color:var(--muted)}.btn{border:0;border-radius:11px;padding:11px 15px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px}.primary{background:var(--teal);color:white}.primary:hover{background:#066b76}.soft{background:#e5f3ef;color:var(--navy)}.danger{background:#fdeaea;color:var(--red)}.outline{background:white;border:1px solid var(--line);color:var(--ink)}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:15px;margin-bottom:20px}.metric{background:white;border:1px solid var(--line);border-radius:17px;padding:19px;box-shadow:var(--shadow);min-width:0}.metric-top{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:13px;gap:8px}.metric-icon{width:35px;height:35px;border-radius:11px;background:#e6f5f0;display:grid;place-items:center;font-size:18px}.metric h2{font-size:25px;margin:12px 0 5px;letter-spacing:-.5px}.metric small{color:var(--muted)}.panel{background:white;border:1px solid var(--line);border-radius:17px;padding:20px;box-shadow:var(--shadow);min-width:0}.panel-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}.panel h3{margin:0;font-size:16px}.panel-sub{font-size:12px;color:var(--muted);margin-top:4px}.dash-grid{display:grid;grid-template-columns:1.35fr 1fr;gap:17px}.bar-chart{height:210px;display:flex;align-items:end;gap:12px;padding:16px 4px 0;border-bottom:1px solid var(--line)}.bar-wrap{flex:1;min-width:0;height:100%;display:flex;flex-direction:column;justify-content:end;align-items:center;gap:7px}.bar{width:min(38px,75%);min-height:3px;border-radius:8px 8px 2px 2px;background:linear-gradient(180deg,#31b6a0,var(--teal));transition:height .25s}.bar-label{font-size:11px;color:var(--muted)}.legend{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:7px;margin-top:13px}.dot{width:8px;height:8px;border-radius:50%;background:var(--teal)}.list{display:grid;gap:0}.list-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:13px 0;border-bottom:1px solid #edf2f0}.list-row:last-child{border-bottom:0}.item-name{font-weight:700;font-size:13px}.item-meta{font-size:12px;color:var(--muted);margin-top:3px}.amount{font-weight:800;white-space:nowrap}.badge{display:inline-block;padding:4px 8px;border-radius:30px;background:#e3f5ee;color:var(--green);font-size:11px;font-weight:800}.badge.warn{background:#fff1d8;color:#986200}.badge.red{background:#fdeaea;color:var(--red)}.section-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:20px}.section-head h1{margin:0;font-size:25px}.section-head p{margin:5px 0 0;color:var(--muted)}.toolbar{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:15px}.search{flex:1;min-width:180px}.field, input, select, textarea{width:100%;padding:11px 12px;border:1px solid #d8e4e0;border-radius:10px;background:white;color:var(--ink);outline:none}.field:focus,input:focus,select:focus,textarea:focus{border-color:var(--teal);box-shadow:0 0 0 3px #087e8b18}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;white-space:nowrap}th{text-align:left;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.6px;padding:12px;border-bottom:1px solid var(--line)}td{padding:13px 12px;border-bottom:1px solid #edf2f0;font-size:13px}tbody tr:last-child td{border-bottom:0}.empty{text-align:center;padding:35px 12px;color:var(--muted)}.empty span{font-size:28px;display:block;margin-bottom:7px}.actions{display:flex;gap:6px}.icon-btn{border:1px solid var(--line);background:white;border-radius:8px;padding:6px 8px}.two-col{display:grid;grid-template-columns:1fr 1fr;gap:16px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.form-field{display:grid;gap:6px}.form-field label{font-size:12px;font-weight:700;color:#52696e}.full{grid-column:1/-1}.modal-back{position:fixed;inset:0;background:#031e25a8;display:grid;place-items:center;padding:18px;z-index:20}.modal{background:white;width:min(560px,100%);max-height:90vh;overflow:auto;border-radius:18px;padding:23px;box-shadow:0 20px 80px #0003}.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.modal-head h2{font-size:19px;margin:0}.modal-foot{display:flex;justify-content:flex-end;gap:9px;margin-top:20px}.notice{background:#fff6df;border:1px solid #f1dfac;color:#765b1a;border-radius:12px;padding:12px 14px;font-size:12px;margin-top:16px}.mobile-head{display:none}.footer-note{font-size:11px;color:var(--muted);text-align:center;margin:24px 0 0}.chart-summary{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.chart-summary div{background:#f4f8f7;padding:12px;border-radius:12px}.chart-summary small{display:block;color:var(--muted);font-size:11px}.chart-summary b{font-size:16px;display:block;margin-top:5px}
@media(max-width:1000px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.dash-grid{grid-template-columns:1fr}.app{grid-template-columns:210px 1fr}.content{padding:22px 20px}.topbar{padding:0 20px}}
@media(max-width:700px){.app{display:block;padding-bottom:70px}.sidebar{display:none}.mobile-head{display:flex;align-items:center;gap:10px;background:var(--deep);color:white;padding:14px 17px}.mobile-head .logo{width:38px;height:38px}.mobile-head strong{font-size:13px}.mobile-head small{display:block;color:#a6c8c7;font-size:10px;letter-spacing:1px}.topbar{height:64px;padding:0 17px}.top-title strong{font-size:16px}.content{padding:20px 15px}.welcome h1{font-size:23px}.welcome{align-items:center}.welcome .btn{font-size:12px;padding:10px}.cards{gap:10px}.metric{padding:14px}.metric h2{font-size:20px}.metric-top{font-size:11px}.metric-icon{width:30px;height:30px}.panel{padding:15px}.section-head h1{font-size:22px}.two-col{grid-template-columns:1fr}.form-grid{grid-template-columns:1fr}.full{grid-column:auto}.bottom-nav{display:grid!important;grid-template-columns:repeat(5,1fr);position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);padding:7px 4px calc(7px + env(safe-area-inset-bottom));z-index:10;box-shadow:0 -6px 20px #123b450b}.bottom-nav button{background:transparent;border:0;color:var(--muted);font-size:10px;display:grid;justify-items:center;gap:3px;padding:5px 0}.bottom-nav button span:first-child{font-size:19px}.bottom-nav button.active{color:var(--teal);font-weight:800}.hide-mobile{display:none}.chart-summary{grid-template-columns:1fr 1fr}.bar-chart{gap:6px}.bar-label{font-size:10px}}
.bottom-nav{display:none}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar">
  <div class="brand"><div class="logo">🌊</div><div><strong>DAN SURF ORIGINAL</strong><small>GESTÃO DA LOJA</small></div></div>
  <nav class="nav" id="sideNav">
    <button data-page="dashboard" class="active"><span class="ico">⌂</span>Visão geral</button>
    <button data-page="sales"><span class="ico">↗</span>Vendas</button>
    <button data-page="inventory"><span class="ico">▦</span>Estoque</button>
    <button data-page="receivables"><span class="ico">◷</span>Contas a receber</button>
    <button data-page="clients"><span class="ico">♙</span>Clientes</button>
    <button data-page="suppliers"><span class="ico">▣</span>Fornecedores</button>
    <button data-page="reports"><span class="ico">▥</span>Relatórios</button>
  </nav>
  <div class="side-note"><b>🌴 Gestão sem complicação</b>Registre as movimentações e acompanhe o resultado da loja em um só lugar.</div>
</aside>
<main class="main">
  <div class="mobile-head"><div class="logo">🌊</div><div><strong>DAN SURF ORIGINAL</strong><small>GESTÃO DA LOJA</small></div></div>
  <header class="topbar"><div class="top-title"><span id="crumb">PAINEL</span><strong id="pageTitle">Visão geral</strong></div><div class="user"><div class="avatar">D</div><div class="hide-mobile"><b>Dan</b><div style="font-size:11px;color:var(--muted)">Administrador</div></div></div></header>
  <div class="content" id="content"></div>
  <nav class="bottom-nav" id="bottomNav">
    <button data-page="dashboard" class="active"><span>⌂</span>Início</button><button data-page="sales"><span>↗</span>Vendas</button><button data-page="inventory"><span>▦</span>Estoque</button><button data-page="receivables"><span>◷</span>A receber</button><button data-page="more"><span>☰</span>Mais</button>
  </nav>
</main>
</div>
<div id="modalRoot"></div>
<script>
const KEY='danSurfOriginalManager_v1';
const blank=()=>({products:[],sales:[],clients:[],suppliers:[],receivables:[]});
let db=loadDB(),page='dashboard',query='';
function loadDB(){try{return {...blank(),...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch(e){return blank()}}
function save(){localStorage.setItem(KEY,JSON.stringify(db));render()}
const money=n=>Number(n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const dateShort=d=>d?new Date(d+'T12:00:00').toLocaleDateString('pt-BR'):'—';
const today=()=>new Date().toISOString().slice(0,10);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sum=(arr,fn)=>arr.reduce((a,x)=>a+fn(x),0);
const paidSales=()=>db.sales.filter(s=>s.status!=='A receber');
const revenue=arr=>sum(arr,s=>Number(s.total)||0);
const costOf=s=>Number(s.cost||0)*Number(s.qty||0);
const profit=s=>Number(s.total||0)-costOf(s);
function titleFor(p){return ({dashboard:'Visão geral',sales:'Vendas',inventory:'Estoque',receivables:'Contas a receber',clients:'Clientes',suppliers:'Fornecedores',reports:'Relatórios'})[p]||'Menu'}
function navTo(p){if(p==='more'){openMore();return}page=p;query='';document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===p));document.getElementById('pageTitle').textContent=titleFor(p);document.getElementById('crumb').textContent=p==='dashboard'?'PAINEL':'GESTÃO';render()}
function render(){const c=document.getElementById('content');document.getElementById('pageTitle').textContent=titleFor(page);if(page==='dashboard')c.innerHTML=dashboard();if(page==='sales')c.innerHTML=salesPage();if(page==='inventory')c.innerHTML=inventoryPage();if(page==='receivables')c.innerHTML=receivablesPage();if(page==='clients')c.innerHTML=clientsPage();if(page==='suppliers')c.innerHTML=suppliersPage();if(page==='reports')c.innerHTML=reportsPage();wireSearch()}
function dashboard(){
const ts=db.sales.filter(s=>s.date===today()),month=new Date().toISOString().slice(0,7),ms=db.sales.filter(s=>s.date?.startsWith(month));
const cash=sum(paidSales(),s=>Number(s.total)),monthProfit=sum(ms,s=>profit(s)),low=db.products.filter(p=>Number(p.stock)<=Number(p.min||0));
const bars=Array.from({length:7},(_,i)=>{let d=new Date();d.setDate(d.getDate()-(6-i));let iso=d.toISOString().slice(0,10);return {label:['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'][d.getDay()],value:revenue(db.sales.filter(s=>s.date===iso))}});
const max=Math.max(1,...bars.map(b=>b.value));
return `<div class="welcome"><div><h1>Olá, Dan! 🌊</h1><p>Veja como a loja está indo hoje.</p></div><button class="btn primary" onclick="openSale()">＋ Nova venda</button></div>
<div class="cards">
<div class="metric"><div class="metric-top">Vendas de hoje <span class="metric-icon">↗</span></div><h2>${money(revenue(ts))}</h2><small>${ts.length} venda(s) registrada(s)</small></div>
<div class="metric"><div class="metric-top">Faturamento do mês <span class="metric-icon">▤</span></div><h2>${money(revenue(ms))}</h2><small>Vendas registradas no mês</small></div>
<div class="metric"><div class="metric-top">Lucro estimado no mês <span class="metric-icon">⌁</span></div><h2>${money(monthProfit)}</h2><small>Venda menos custo cadastrado</small></div>
<div class="metric"><div class="metric-top">Itens em estoque <span class="metric-icon">▦</span></div><h2>${sum(db.products,p=>Number(p.stock)||0)}</h2><small>${low.length} produto(s) com estoque baixo</small></div></div>
<div class="dash-grid"><section class="panel"><div class="panel-head"><div><h3>Vendas nos últimos 7 dias</h3><div class="panel-sub">Faturamento por dia</div></div><button class="btn soft" onclick="navTo('reports')">Ver relatórios</button></div><div class="bar-chart">${bars.map(b=>`<div class="bar-wrap"><div class="bar" title="${money(b.value)}" style="height:${Math.max(2,b.value/max*78)}%"></div><div class="bar-label">${b.label}</div></div>`).join('')}</div><div class="legend"><span class="dot"></span>Faturamento registrado</div></section>
<section class="panel"><div class="panel-head"><div><h3>Estoque para conferir</h3><div class="panel-sub">Produtos no limite ou abaixo dele</div></div><button class="btn soft" onclick="navTo('inventory')">Estoque</button></div>${low.length?`<div class="list">${low.slice(0,5).map(p=>`<div class="list-row"><div><div class="item-name">${esc(p.name)}</div><div class="item-meta">Mínimo: ${p.min||0} un.</div></div><span class="badge ${Number(p.stock)===0?'red':'warn'}">${p.stock} un.</span></div>`).join('')}</div>`:`<div class="empty"><span>✓</span>Nenhum alerta de estoque por enquanto.</div>`}</section>
<section class="panel"><div class="panel-head"><div><h3>Vendas recentes</h3><div class="panel-sub">Últimas movimentações</div></div><button class="btn soft" onclick="navTo('sales')">Ver todas</button></div>${db.sales.length?`<div class="list">${[...db.sales].sort((a,b)=>(b.created||'').localeCompare(a.created||'')).slice(0,5).map(s=>`<div class="list-row"><div><div class="item-name">${esc(s.productName)}</div><div class="item-meta">${esc(s.clientName||'Cliente não informado')} · ${dateShort(s.date)}</div></div><div style="text-align:right"><div class="amount">${money(s.total)}</div><span class="badge ${s.status==='A receber'?'warn':''}">${esc(s.status||'Pago')}</span></div></div>`).join('')}</div>`:`<div class="empty"><span>🧾</span>As vendas registradas aparecerão aqui.</div>`}</section>
<section class="panel"><div class="panel-head"><div><h3>Atalhos</h3><div class="panel-sub">Acesse as áreas mais usadas</div></div></div><div class="two-col"><button class="btn soft" onclick="openProduct()">＋ Cadastrar produto</button><button class="btn soft" onclick="openClient()">＋ Cadastrar cliente</button><button class="btn soft" onclick="navTo('receivables')">◷ Contas a receber</button><button class="btn soft" onclick="navTo('suppliers')">▣ Fornecedores</button></div></section></div><div class="footer-note">Os valores dependem dos dados cadastrados. Cadastre o custo dos produtos para estimar o lucro.</div>`
}
function toolbar(placeholder,btn,fn){return `<div class="toolbar"><input class="search" id="searchBox" placeholder="${placeholder}" value="${esc(query)}"><button class="btn primary" onclick="${fn}">＋ ${btn}</button></div>`}
function salesPage(){let arr=[...db.sales].sort((a,b)=>(b.date||'').localeCompare(a.date||'')).filter(s=>(s.productName+' '+(s.clientName||'')+' '+s.status).toLowerCase().includes(query.toLowerCase()));return `<div class="section-head"><div><h1>Vendas</h1><p>Registre e acompanhe as vendas da loja.</p></div><button class="btn primary" onclick="openSale()">＋ Nova venda</button></div><div class="cards"><div class="metric"><div class="metric-top">Vendas registradas</div><h2>${db.sales.length}</h2></div><div class="metric"><div class="metric-top">Faturamento total</div><h2>${money(revenue(db.sales))}</h2></div><div class="metric"><div class="metric-top">Lucro estimado</div><h2>${money(sum(db.sales,profit))}</h2></div><div class="metric"><div class="metric-top">A receber</div><h2>${money(sum(db.receivables.filter(r=>r.status!=='Recebido'),r=>Number(r.amount)))}</h2></div></div>${toolbar('Buscar por produto, cliente ou status…','Nova venda','openSale()')}<div class="panel"><div class="table-wrap"><table><thead><tr><th>Data</th><th>Produto</th><th>Cliente</th><th>Qtd.</th><th>Total</th><th>Lucro est.</th><th>Status</th><th></th></tr></thead><tbody>${arr.length?arr.map(s=>`<tr><td>${dateShort(s.date)}</td><td><b>${esc(s.productName)}</b></td><td>${esc(s.clientName||'—')}</td><td>${s.qty}</td><td><b>${money(s.total)}</b></td><td>${money(profit(s))}</td><td><span class="badge ${s.status==='A receber'?'warn':''}">${esc(s.status||'Pago')}</span></td><td><button class="icon-btn" onclick="deleteSale('${s.id}')">🗑</button></td></tr>`).join(''):`<tr><td colspan="8" class="empty"><span>🧾</span>Nenhuma venda encontrada.</td></tr>`}</tbody></table></div></div>`}
function inventoryPage(){let arr=db.products.filter(p=>(p.name+' '+(p.sku||'')+' '+(p.category||'')).toLowerCase().includes(query.toLowerCase()));return `<div class="section-head"><div><h1>Estoque</h1><p>Produtos, custos, preços e quantidades disponíveis.</p></div><button class="btn primary" onclick="openProduct()">＋ Produto</button></div><div class="cards"><div class="metric"><div class="metric-top">Produtos cadastrados</div><h2>${db.products.length}</h2></div><div class="metric"><div class="metric-top">Unidades disponíveis</div><h2>${sum(db.products,p=>Number(p.stock)||0)}</h2></div><div class="metric"><div class="metric-top">Valor de custo em estoque</div><h2>${money(sum(db.products,p=>Number(p.cost)*Number(p.stock)))}</h2></div><div class="metric"><div class="metric-top">Estoque baixo</div><h2>${db.products.filter(p=>Number(p.stock)<=Number(p.min||0)).length}</h2></div></div>${toolbar('Buscar produto, categoria ou código…','Cadastrar produto','openProduct()')}<div class="panel"><div class="table-wrap"><table><thead><tr><th>Produto</th><th>Categoria</th><th>Código</th><th>Custo</th><th>Preço</th><th>Estoque</th><th></th></tr></thead><tbody>${arr.length?arr.map(p=>`<tr><td><b>${esc(p.name)}</b></td><td>${esc(p.category||'—')}</td><td>${esc(p.sku||'—')}</td><td>${money(p.cost)}</td><td><b>${money(p.price)}</b></td><td><span class="badge ${Number(p.stock)<=Number(p.min||0)?'warn':''}">${p.stock} un.</span></td><td><div class="actions"><button class="icon-btn" onclick="openProduct('${p.id}')">✎</button><button class="icon-btn" onclick="deleteItem('products','${p.id}')">🗑</button></div></td></tr>`).join(''):`<tr><td colspan="7" class="empty"><span>📦</span>Nenhum produto cadastrado. Comece adicionando o estoque da loja.</td></tr>`}</tbody></table></div></div>`}
function receivablesPage(){let arr=db.receivables.filter(r=>(r.description+' '+r.clientName+' '+r.status).toLowerCase().includes(query.toLowerCase()));return `<div class="section-head"><div><h1>Contas a receber</h1><p>Acompanhe valores pendentes e pagamentos recebidos.</p></div><button class="btn primary" onclick="openReceivable()">＋ Lançar conta</button></div><div class="cards"><div class="metric"><div class="metric-top">Em aberto</div><h2>${money(sum(db.receivables.filter(r=>r.status!=='Recebido'),r=>Number(r.amount)))}</h2></div><div class="metric"><div class="metric-top">Contas pendentes</div><h2>${db.receivables.filter(r=>r.status!=='Recebido').length}</h2></div><div class="metric"><div class="metric-top">Recebido</div><h2>${money(sum(db.receivables.filter(r=>r.status==='Recebido'),r=>Number(r.amount)))}</h2></div></div>${toolbar('Buscar cliente, descrição ou status…','Lançar conta','openReceivable()')}<div class="panel"><div class="table-wrap"><table><thead><tr><th>Vencimento</th><th>Descrição</th><th>Cliente</th><th>Valor</th><th>Status</th><th>Ação</th></tr></thead><tbody>${arr.length?arr.map(r=>`<tr><td>${dateShort(r.due)}</td><td><b>${esc(r.description)}</b></td><td>${esc(r.clientName||'—')}</td><td><b>${money(r.amount)}</b></td><td><span class="badge ${r.status==='Recebido'?'':'warn'}">${esc(r.status)}</span></td><td><div class="actions">${r.status!=='Recebido'?`<button class="btn soft" onclick="markReceived('${r.id}')">Recebido</button>`:''}<button class="icon-btn" onclick="deleteItem('receivables','${r.id}')">🗑</button></div></td></tr>`).join(''):`<tr><td colspan="6" class="empty"><span>◷</span>Nenhuma conta a receber cadastrada.</td></tr>`}</tbody></table></div></div>`}
function clientsPage(){let arr=db.clients.filter(p=>(p.name+' '+(p.phone||'')+' '+(p.email||'')).toLowerCase().includes(query.toLowerCase()));return `<div class="section-head"><div><h1>Clientes</h1><p>Cadastro e contato dos clientes.</p></div><button class="btn primary" onclick="openClient()">＋ Cliente</button></div>${toolbar('Buscar nome, telefone ou e-mail…','Cadastrar cliente','openClient()')}<div class="panel"><div class="table-wrap"><table><thead><tr><th>Nome</th><th>Telefone</th><th>E-mail</th><th>Vendas</th><th>Total comprado</th><th></th></tr></thead><tbody>${arr.length?arr.map(c=>{let ss=db.sales.filter(s=>s.clientId===c.id);return `<tr><td><b>${esc(c.name)}</b></td><td>${esc(c.phone||'—')}</td><td>${esc(c.email||'—')}</td><td>${ss.length}</td><td>${money(revenue(ss))}</td><td><button class="icon-btn" onclick="deleteItem('clients','${c.id}')">🗑</button></td></tr>`}).join(''):`<tr><td colspan="6" class="empty"><span>♙</span>Nenhum cliente cadastrado.</td></tr>`}</tbody></table></div></div>`}
function suppliersPage(){let arr=db.suppliers.filter(p=>(p.name+' '+(p.phone||'')+' '+(p.products||'')).toLowerCase().includes(query.toLowerCase()));return `<div class="section-head"><div><h1>Fornecedores</h1><p>Organize contatos e produtos de cada fornecedor.</p></div><button class="btn primary" onclick="openSupplier()">＋ Fornecedor</button></div>${toolbar('Buscar fornecedor, telefone ou produto…','Cadastrar fornecedor','openSupplier()')}<div class="panel"><div class="table-wrap"><table><thead><tr><th>Fornecedor</th><th>Contato</th><th>Telefone</th><th>Produtos / observações</th><th></th></tr></thead><tbody>${arr.length?arr.map(s=>`<tr><td><b>${esc(s.name)}</b></td><td>${esc(s.contact||'—')}</td><td>${esc(s.phone||'—')}</td><td>${esc(s.products||'—')}</td><td><button class="icon-btn" onclick="deleteItem('suppliers','${s.id}')">🗑</button></td></tr>`).join(''):`<tr><td colspan="5" class="empty"><span>▣</span>Nenhum fornecedor cadastrado.</td></tr>`}</tbody></table></div></div>`}
function reportsPage(){let month=new Date().toISOString().slice(0,7),ms=db.sales.filter(s=>s.date?.startsWith(month)),paid=paidSales(),top={};db.sales.forEach(s=>top[s.productName]=(top[s.productName]||0)+Number(s.qty||0));let tops=Object.entries(top).sort((a,b)=>b[1]-a[1]).slice(0,5);return `<div class="section-head"><div><h1>Relatórios</h1><p>Indicadores de vendas, lucro e produtos.</p></div><button class="btn outline" onclick="exportCSV()">⇩ Exportar CSV</button></div><div class="cards"><div class="metric"><div class="metric-top">Faturamento total</div><h2>${money(revenue(db.sales))}</h2><small>Todos os lançamentos</small></div><div class="metric"><div class="metric-top">Lucro estimado</div><h2>${money(sum(db.sales,profit))}</h2><small>Receita menos custo cadastrado</small></div><div class="metric"><div class="metric-top">Faturamento do mês</div><h2>${money(revenue(ms))}</h2><small>${new Date().toLocaleDateString('pt-BR',{month:'long',year:'numeric'})}</small></div><div class="metric"><div class="metric-top">Contas em aberto</div><h2>${money(sum(db.receivables.filter(r=>r.status!=='Recebido'),r=>Number(r.amount)))}</h2><small>${db.receivables.filter(r=>r.status!=='Recebido').length} conta(s)</small></div></div><div class="two-col"><section class="panel"><div class="panel-head"><div><h3>Resumo do mês</h3><div class="panel-sub">Visão do desempenho mensal</div></div></div><div class="chart-summary"><div><small>Vendas</small><b>${ms.length}</b></div><div><small>Unidades</small><b>${sum(ms,s=>Number(s.qty)||0)}</b></div><div><small>Lucro estimado</small><b>${money(sum(ms,profit))}</b></div></div><div class="notice">O lucro é uma estimativa com base no custo unitário informado no cadastro do produto. Despesas, taxas e impostos não são descontados automaticamente.</div></section><section class="panel"><div class="panel-head"><div><h3>Mais vendidos</h3><div class="panel-sub">Por quantidade registrada</div></div></div>${tops.length?`<div class="list">${tops.map(([n,q],i)=>`<div class="list-row"><div><div class="item-name">${i+1}. ${esc(n)}</div><div class="item-meta">Unidades vendidas</div></div><span class="badge">${q} un.</span></div>`).join('')}</div>`:`<div class="empty"><span>📊</span>Os produtos mais vendidos aparecerão aqui.</div>`}</section></div><div class="panel" style="margin-top:16px"><div class="panel-head"><div><h3>Últimos 30 dias</h3><div class="panel-sub">Faturamento por data</div></div></div>${reportChart()}</div>`}
function reportChart(){let days=Array.from({length:14},(_,i)=>{let d=new Date();d.setDate(d.getDate()-(13-i));let iso=d.toISOString().slice(0,10);return {date:iso,label:d.getDate()+'/'+(d.getMonth()+1),value:revenue(db.sales.filter(s=>s.date===iso))}}),max=Math.max(1,...days.map(d=>d.value));return `<div class="bar-chart">${days.map(d=>`<div class="bar-wrap"><div class="bar" title="${dateShort(d.date)}: ${money(d.value)}" style="height:${Math.max(2,d.value/max*78)}%"></div><div class="bar-label">${d.label}</div></div>`).join('')}</div>`}
function modal(title,body,submitLabel,submit){document.getElementById('modalRoot').innerHTML=`<div class="modal-back" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="modal-head"><h2>${title}</h2><button class="icon-btn" onclick="closeModal()">✕</button></div><form id="entryForm">${body}<div class="modal-foot"><button type="button" class="btn outline" onclick="closeModal()">Cancelar</button><button class="btn primary" type="submit">${submitLabel}</button></div></form></div></div>`;document.getElementById('entryForm').onsubmit=e=>{e.preventDefault();submit(new FormData(e.target));}}
function closeModal(){document.getElementById('modalRoot').innerHTML=''}
function f(label,name,type='text',value='',opts=''){return `<div class="form-field"><label>${label}</label>${type==='select'?`<select name="${name}" ${opts}>${value}</select>`:type==='textarea'?`<textarea name="${name}" rows="2" ${opts}>${esc(value)}</textarea>`:`<input name="${name}" type="${type}" value="${esc(value)}" ${opts}>`}</div>`}
function openProduct(id){let p=db.products.find(x=>x.id===id)||{};modal(id?'Editar produto':'Cadastrar produto',`<div class="form-grid">${f('Nome do produto *','name','text',p.name||'','required')}${f('Categoria','category','text',p.category||'')}${f('Código / SKU','sku','text',p.sku||'')}${f('Fornecedor','supplier','select',`<option value="">Selecione</option>${db.suppliers.map(s=>`<option ${s.name===p.supplier?'selected':''}>${esc(s.name)}</option>`).join('')}`)}${f('Custo unitário (R$) *','cost','number',p.cost??'','min="0" step="0.01" required')}${f('Preço de venda (R$) *','price','number',p.price??'','min="0" step="0.01" required')}${f('Quantidade em estoque *','stock','number',p.stock??0,'min="0" step="1" required')}${f('Estoque mínimo','min','number',p.min??2,'min="0" step="1')}</div>`,id?'Salvar alterações':'Salvar produto',d=>{let obj={id:p.id||uid(),name:d.get('name').trim(),category:d.get('category'),sku:d.get('sku'),supplier:d.get('supplier'),cost:Number(d.get('cost')),price:Number(d.get('price')),stock:Number(d.get('stock')),min:Number(d.get('min'))};if(!obj.name)return;let ix=db.products.findIndex(x=>x.id===obj.id);if(ix>=0)db.products[ix]=obj;else db.products.push(obj);closeModal();save()})}
function openClient(){modal('Cadastrar cliente',`<div class="form-grid">${f('Nome completo *','name','text','','required')}${f('Telefone / WhatsApp','phone','tel')}${f('E-mail','email','email')}${f('Observações','notes','textarea')}</div>`, 'Salvar cliente',d=>{let name=d.get('name').trim();if(!name)return;db.clients.push({id:uid(),name,phone:d.get('phone'),email:d.get('email'),notes:d.get('notes')});closeModal();save()})}
function openSupplier(){modal('Cadastrar fornecedor',`<div class="form-grid">${f('Nome da empresa *','name','text','','required')}${f('Pessoa de contato','contact')}${f('Telefone','phone','tel')}${f('Produtos / observações','products','textarea')}</div>`,'Salvar fornecedor',d=>{let name=d.get('name').trim();if(!name)return;db.suppliers.push({id:uid(),name,contact:d.get('contact'),phone:d.get('phone'),products:d.get('products')});closeModal();save()})}
function openSale(){if(!db.products.length){alert('Cadastre pelo menos um produto no estoque antes de registrar uma venda.');navTo('inventory');return}modal('Registrar nova venda',`<div class="form-grid">${f('Produto *','productId','select',`<option value="">Selecione um produto</option>${db.products.map(p=>`<option value="${p.id}">${esc(p.name)} — ${p.stock} un. · ${money(p.price)}</option>`).join('')}`,'required')}${f('Quantidade *','qty','number',1,'min="1" step="1" required')}${f('Cliente','clientId','select',`<option value="">Cliente não informado</option>${db.clients.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}`)}${f('Data da venda *','date','date',today(),'required')}${f('Forma de pagamento','payment','select','<option>Pix</option><option>Dinheiro</option><option>Cartão de débito</option><option>Cartão de crédito</option><option>Transferência</option><option>Fiado / a receber</option>')}${f('Desconto total (R$)','discount','number',0,'min="0" step="0.01"')}</div><div class="notice">O estoque será reduzido automaticamente. Para vendas a prazo, o sistema também cria uma conta a receber.</div>`,'Registrar venda',d=>{let p=db.products.find(x=>x.id===d.get('productId')),qty=Number(d.get('qty')),discount=Number(d.get('discount')||0);if(!p||qty<1)return;if(qty>Number(p.stock)){alert('Quantidade maior que o estoque disponível.');return}let client=db.clients.find(c=>c.id===d.get('clientId')),total=Math.max(0,Number(p.price)*qty-discount),status=d.get('payment')==='Fiado / a receber'?'A receber':'Pago';let sale={id:uid(),productId:p.id,productName:p.name,clientId:client?.id||'',clientName:client?.name||'',qty,cost:Number(p.cost),unitPrice:Number(p.price),discount,total,date:d.get('date'),payment:d.get('payment'),status,created:new Date().toISOString()};p.stock-=qty;db.sales.push(sale);if(status==='A receber')db.receivables.push({id:uid(),description:'Venda: '+p.name,clientName:client?.name||'Cliente não informado',clientId:client?.id||'',amount:total,due:d.get('date'),status:'Pendente',saleId:sale.id});closeModal();save()})}
function openReceivable(){modal('Lançar conta a receber',`<div class="form-grid">${f('Descrição *','description','text','','required')}${f('Cliente','clientId','select',`<option value="">Não informado</option>${db.clients.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}`)}${f('Valor (R$) *','amount','number','','min="0.01" step="0.01" required')}${f('Vencimento','due','date',today())}</div>`,'Salvar conta',d=>{let client=db.clients.find(c=>c.id===d.get('clientId'));db.receivables.push({id:uid(),description:d.get('description').trim(),clientId:client?.id||'',clientName:client?.name||'',amount:Number(d.get('amount')),due:d.get('due'),status:'Pendente'});closeModal();save()})}
function markReceived(id){let r=db.receivables.find(x=>x.id===id);if(!r)return;r.status='Recebido';if(r.saleId){let s=db.sales.find(x=>x.id===r.saleId);if(s)s.status='Pago'}save()}
function deleteItem(type,id){if(!confirm('Tem certeza que deseja excluir este registro?'))return;db[type]=db[type].filter(x=>x.id!==id);save()}
function deleteSale(id){if(!confirm('Excluir esta venda? O estoque será devolvido.'))return;let s=db.sales.find(x=>x.id===id);if(s){let p=db.products.find(x=>x.id===s.productId);if(p)p.stock+=Number(s.qty);db.receivables=db.receivables.filter(r=>r.saleId!==id)}db.sales=db.sales.filter(x=>x.id!==id);save()}
function wireSearch(){let el=document.getElementById('searchBox');if(el)el.oninput=e=>{query=e.target.value;let pos=e.target.selectionStart;render();let next=document.getElementById('searchBox');if(next){next.focus();next.setSelectionRange(pos,pos)}}}
function exportCSV(){let rows=[['Data','Produto/Descrição','Cliente','Quantidade','Total','Custo total','Lucro estimado','Status'],...db.sales.map(s=>[s.date,s.productName,s.clientName,s.qty,s.total,costOf(s),profit(s),s.status])];let csv=rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(';')).join('\r\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8;'}));a.download='relatorio-dan-surf-original.csv';a.click();URL.revokeObjectURL(a.href)}
function openMore(){modal('Menu de gestão',`<div class="list">${[['clients','♙ Clientes'],['suppliers','▣ Fornecedores'],['reports','▥ Relatórios'],['receivables','◷ Contas a receber']].map(([p,n])=>`<button class="btn outline" style="width:100%;justify-content:flex-start;margin:4px 0" type="button" onclick="closeModal();navTo('${p}')">${n}</button>`).join('')}<button class="btn outline" style="width:100%;justify-content:flex-start;margin:4px 0" type="button" onclick="backupData()">⇩ Fazer backup dos dados</button><button class="btn outline" style="width:100%;justify-content:flex-start;margin:4px 0" type="button" onclick="restoreData()">⇧ Restaurar backup JSON</button></div><div class="notice">Os dados ficam neste navegador/dispositivo. Faça backups frequentes.</div>`,'Fechar',()=>closeModal())}
function backupData(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:'application/json'}));a.download='dan-surf-backup.json';a.click();URL.revokeObjectURL(a.href)}
function restoreData(){let input=document.createElement('input');input.type='file';input.accept='.json,application/json';input.onchange=async()=>{try{let obj=JSON.parse(await input.files[0].text());if(!obj.products||!obj.sales)throw Error();db={...blank(),...obj};save();closeModal();alert('Backup restaurado com sucesso.')}catch(e){alert('Não foi possível ler esse backup.')}};input.click()}
document.querySelectorAll('[data-page]').forEach(b=>b.addEventListener('click',()=>navTo(b.dataset.page)));
render();
</script>
</body></html>
